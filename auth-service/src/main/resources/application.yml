server:
  port: 9001

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5440/auth_db
    username: pameobeo
    password: ${DB_PASSWORD:pameobeo}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

auth:
  jwt:
    issuer: pameobeo-auth
    key-id: pameobeo-key-1
    key-dir: ${AUTH_KEY_DIR:.keys}
  session:
    access-token-ttl: ${ACCESS_TOKEN_TTL:15m}
    idle-timeout: ${IDLE_TIMEOUT:30m}
    absolute-timeout: ${ABSOLUTE_TIMEOUT:7d}
  login:
    max-failed-attempts: ${MAX_FAILED_ATTEMPTS:5}
    lock-duration: ${LOCK_DURATION:15m}
  admin:
    email: admin@pameobeo.vn
    password: ${ADMIN_PASSWORD:Admin@123}
    full-name: Pameobeo Admin

management:
  endpoints:
    web:
      exposure:
        include: health,info
