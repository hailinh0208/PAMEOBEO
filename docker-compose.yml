# Infrastructure only. The 5 Spring Boot services run on the host (see README),
# which keeps memory usage low enough for a small Docker VM.
name: pameobeo

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: pameobeo
      POSTGRES_PASSWORD: pameobeo
      POSTGRES_DB: postgres
    ports:
      - "5440:5432"
    volumes:
      - ./infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pameobeo"]
      interval: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: "-Xmx384m -Xms384m"

  kafka-ui:
    image: kafbat/kafka-ui:v1.3.0
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: pameobeo
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      JAVA_OPTS: "-Xmx256m"
    depends_on:
      - kafka

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    environment:
      # Skip the reverse DNS lookup of the client IP: it delays every SMTP connection by ~8 s
      MP_SMTP_DISABLE_RDNS: "true"

volumes:
  postgres-data:
